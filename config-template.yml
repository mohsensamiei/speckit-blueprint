# speckit-blueprint configuration. Every key is optional; defaults are shown.

# Where the blueprint lives (a project with one blueprint; for several, see `blueprints:` at the end).
blueprint_path: docs/BLUEPRINT.md

# Where spec-kit feature folders live.
specs_dir: specs

# Where bootstrap writes the decisions log and the review checklist.
decisions_path: docs/DECISIONS.md
review_checklist_path: docs/REVIEW-CHECKLIST.md

# false: bootstrap leaves CLAUDE.md alone (for a CLAUDE.md that only imports other files).
claude_md: true

# Blueprint sections compiled into .specify/memory/constitution.md (or its managed block)
# (read by /speckit-tasks and /speckit-implement in every epic, so keep it lean).
constitution_sections:
  - "13.2"
  - "13.5"
  - "13.6"
  - "13.7"
  - "13.9"
  - "13.10"
  - "14.2"
  - "14.3"
  - "14.8"
  - "12.10"

# own:    bootstrap writes the whole constitution (a new project).
# append: the project keeps its constitution; bootstrap maintains one managed block in it, which applies
#         only to features compiled from the blueprint and yields to the project's principles.
# auto:   own when the constitution is missing or still the `specify init` template, otherwise append.
constitution_mode: auto

# append mode: when the managed block is added or its rules change, bump the project's constitution
# version (minor | patch | none) and set Last Amended. No Sync Impact Report comment is created.
constitution_version_bump: minor

# Blueprint sections copied into each epic's plan.md "Technical Context".
plan_sections:
  - "12.2"
  - "13.1"
  - "13.3"
  - "13.4"

# IDs of these types found inside resolved flows, screens and edge cases are resolved too.
second_level_types:
  - CP
  - EC

# Block Edit/Write on compiled files (spec.md, plan.md, research.md, data-model.md,
# quickstart.md, contracts/, constitution) in Claude Code.
guard: true

# Several blueprints in one project (one per product), instead of blueprint_path, decisions_path and
# review_checklist_path above. Each id gets its own decisions log, review checklist, constitution block
# and CLAUDE.md block; feature folders are named NNN-<id>-eNN-<slug> and their .blueprint.json records
# the id. Commands take `--blueprint <id>` (or `<id>:E01`) and default to the active feature's blueprint.
# Folders compiled before ids existed, and unmarked managed blocks, belong to the default blueprint
# (default_blueprint, else the first listed).
#
# default_blueprint: one
# blueprints:
#   one:
#     path: docs/BLUEPRINT.md
#     decisions: docs/DECISIONS.md               # default: next to the blueprint (docs/DECISIONS.md)
#     checklist: docs/REVIEW-CHECKLIST.md        # default: next to the blueprint
#   desk:
#     path: docs/desk/BLUEPRINT.md
#     prefix: DESK              # how its IDs are written in shared files (DESK:DR-03); default: the id in
#                               # capitals when there are several blueprints, "" to switch off
#     number_base: 500          # its feature folders are numbered from 501, so parallel branches of
#                               # different blueprints never take the same number
#     sources:                  # where the existing product lives, for brownfield discover
#       - ../evida-desk
#       - ../desk-prototype
#     constitution_sections: ["13.2", "13.5", "14.2"]   # optional: overrides the lists above for this id
#     plan_sections: ["12.2", "13.4"]
